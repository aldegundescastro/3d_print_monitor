name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Structure
        run: flutter create . --platforms=android --org com.comercial.monitor3d

      - name: Install Dependencies
        run: flutter pub get

      # CORREÇÃO: Força o compilador a ignorar checagens e downloads pesados/instáveis do NDK
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0.0 --build-number=1 --pub -Pandroid.experimental.ndk.versionCheck.strict=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk